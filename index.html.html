<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Meu Dinheiro</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f2f4f0;--s:#fff;--ink:#14201c;--mut:#5d6b65;--ln:#dde3dd;--g:#0f7a5c;--r:#b4372f;--b:#2a5bd7;--y:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101714;--s:#18221e;--ink:#e8efeb;--mut:#92a39b;--ln:#2a3731;--g:#3fc79b;--r:#ef7b72;--b:#7ea3ff;--y:#e5b351}}
:root[data-theme=dark]{--bg:#101714;--s:#18221e;--ink:#e8efeb;--mut:#92a39b;--ln:#2a3731;--g:#3fc79b;--r:#ef7b72;--b:#7ea3ff;--y:#e5b351}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Instrument Sans',system-ui,sans-serif}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{padding:20px 14px;border-right:1px solid var(--ln);position:sticky;top:0;height:100vh}
nav h1{font-size:18px;margin:0 0 18px 8px}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--s);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 var(--g)}
main{padding:22px;max-width:1100px;width:100%}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.top h2{margin:0 auto 0 0;font-size:24px}
input,select,button.b{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
button.b{cursor:pointer;font-weight:600}button.p{background:var(--g);color:#fff;border-color:var(--g)}:root[data-theme=dark] button.p{color:#06231a}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.c{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:14px}.c small{color:var(--mut)}
.big{font-size:22px;font-weight:700;margin:2px 0}.pos{color:var(--g)}.neg{color:var(--r)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:14px}
.cv{position:relative;height:260px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mut);font-weight:500}
.sc{overflow-x:auto}.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:9}
.empty{text-align:center;color:var(--mut);padding:30px}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:5;display:flex;justify-content:space-around;background:var(--s);border-top:1px solid var(--ln);border-right:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}nav h1{display:none}nav button{width:auto;flex:1;text-align:center;font-size:11px;padding:6px 2px}nav button span{display:block;font-size:20px}nav button.on{box-shadow:none;background:none;color:var(--g)}main{padding:14px 14px 96px}#toast{bottom:84px}}
.cn{animation:fall .9s ease-in both}@keyframes fall{0%{transform:translateY(-14px);opacity:0}15%{opacity:1}100%{transform:translateY(34px);opacity:1}}.lv{transform-box:fill-box;transform-origin:bottom;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}.mascot{font-size:54px;line-height:1}.wal{display:flex;gap:14px;align-items:center;flex-wrap:wrap}@media(prefers-reduced-motion:reduce){.cn{animation:none;opacity:0}.lv{transition:none}}
</style></head><body><div class="app"><nav id="nav"></nav><main id="m"></main></div><div id="toast" role="status"></div>
<script>
const DC=['Alimentação','Combustível','Transporte','Faculdade','Moradia','Água, luz e internet','Saúde','Lazer','Assinaturas','Compras','Impostos','Dívidas','Outros'],RC=['Salário','Extra','Freelance','Rendimentos','Reembolso','Outros'];
let S={tx:[],goals:[],tasks:[],bud:{},theme:'',hide:false};
try{const x=JSON.parse(localStorage.getItem('fin1'));if(x)S=Object.assign(S,x)}catch(e){}
if(S.theme)document.documentElement.dataset.theme=S.theme;
let V='dash',P='mes',CF='',CT='',F={cat:'',q:'',t:''},pend=null,CH=[];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem('fin1',JSON.stringify(S))}catch(e){}};
const money=c=>S.hide?'R$ ••••':(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cents=s=>{const n=parseFloat(String(s).replace(/\./g,'').replace(',','.'));return isNaN(n)?0:Math.round(n*100)};
const fd=i=>i.split('-').reverse().join('/'),ld=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2500)};
function rng(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();let a,b=new Date(y,m+1,0);
if(P=='mes')a=new Date(y,m,1);else if(P=='ant'){a=new Date(y,m-1,1);b=new Date(y,m,0)}else if(P=='ano'){a=new Date(y,0,1);b=new Date(y,11,31)}else if(P=='custom'&&CF&&CT)return[CF,CT];else a=new Date(y,m-(+P||1)+1,1);return[ld(a),ld(b)]}
function prng(a,b){const A=new Date(a+'T00:00'),B=new Date(b+'T00:00'),L=Math.round((B-A)/864e5)+1,pb=new Date(A-864e5),pa=new Date(pb-(L-1)*864e5);return[ld(pa),ld(pb)]}
const ok=x=>x.st=='ok';
const sum=(t,a,b,c)=>S.tx.filter(x=>ok(x)&&x.t==t&&x.date>=a&&x.date<=b&&(!c||x.cat==c)).reduce((s,x)=>s+x.v,0);
const sumM=(t,ym)=>S.tx.filter(x=>ok(x)&&x.t==t&&x.date.startsWith(ym)).reduce((s,x)=>s+x.v,0);
function months(a,b){const r=[];let y=+a.slice(0,4),m=+a.slice(5,7);const e=b.slice(0,7);while(r.length<24){const k=`${y}-${String(m).padStart(2,'0')}`;r.push(k);if(k>=e)break;if(++m>12){m=1;y++}}return r}
const mlab=k=>['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+k.slice(5)-1]+'/'+k.slice(2,4);
function vr(c,p){if(!p)return'<small>sem base de comparação</small>';const d=c-p,pc=d/p*100;return`<small class="${d>0?'':''}">${d>=0?'+':'−'}${money(Math.abs(d))} (${pc>=0?'+':''}${pc.toFixed(0)}%) vs. período anterior</small>`}
function periodBar(){return`<select id="pp" onchange="P=this.value;render()"><option value="mes">Mês atual</option><option value="ant">Mês anterior</option><option value="3">Últimos 3 meses</option><option value="6">Últimos 6 meses</option><option value="12">Últimos 12 meses</option><option value="ano">Ano atual</option><option value="custom">Personalizado</option></select>${P=='custom'?`<input type="date" value="${CF}" onchange="CF=this.value;render()" aria-label="De"><input type="date" value="${CT}" onchange="CT=this.value;render()" aria-label="Até">`:''}`}
function head(t,extra=''){return`<div class="top"><h2>${t}</h2>${extra}<button class="b" onclick="S.hide=!S.hide;save();render()">${S.hide?'Mostrar valores':'Ocultar valores'}</button><button class="b" onclick="S.theme=(document.documentElement.dataset.theme=='dark'?'light':'dark');document.documentElement.dataset.theme=S.theme;save();render()">Tema</button></div>`}
function dash(){const[a,b]=rng(),[pa,pb]=prng(a,b),R=sum('r',a,b),D=sum('d',a,b),pR=sum('r',pa,pb),pD=sum('d',pa,pb);
const bal=S.tx.filter(ok).reduce((s,x)=>s+(x.t=='r'?x.v:-x.v),0),tx=R>0?(R-D)/R*100:null,gs=S.goals.reduce((s,g)=>s+g.saved,0),gt=S.goals.reduce((s,g)=>s+g.target,0);
if(!S.tx.length)return head('Início')+`<div class="c empty"><p><b>Nenhum lançamento ainda.</b></p><p>Registre uma receita ou despesa para ver indicadores e gráficos.</p><button class="b p" onclick="V='tx';render()">Adicionar primeiro lançamento</button></div>`;
const card=(t,v,s,cls='')=>`<div class="c"><small>${t}</small><div class="big ${cls}">${v}</div>${s}</div>`;
const top=DC.map(c=>[c,sum('d',a,b,c)]).sort((x,y)=>y[1]-x[1])[0];
const ins=[];if(top&&top[1]>0&&D>0)ins.push(`Maior gasto do período: ${top[0]}, ${money(top[1])} (${(top[1]/D*100).toFixed(0)}% das despesas).`);
if(pD>0)ins.push(`Suas despesas ${D>=pD?'subiram':'caíram'} ${Math.abs((D-pD)/pD*100).toFixed(0)}% em relação ao período anterior.`);
if(S.tx.filter(ok).length<10)ins.push('Poucos dados cadastrados: as análises ficam mais confiáveis com mais lançamentos.');
const pend2=S.tx.filter(x=>!ok(x)).length;if(pend2)ins.push(`${pend2} lançamento(s) previsto(s) ainda não efetivado(s); eles não entram nos totais.`);
const wm=S.wm||0,wr=wm?Math.max(0,Math.min(bal/wm,1)):0,rt=wm?bal/wm:0,mood=!wm?['😐','Defina uma meta de saldo para ver como você está.']:rt<.5?['😢','Saldo bem abaixo da meta.']:rt<1?['😕','Saldo abaixo da meta.']:rt<1.5?['😀','Meta de saldo atingida!']:['🤩','Muito acima da meta!'],dp=AN&&AN.w;
return head('Início',periodBar())+`<div class="c wal" style="margin-bottom:12px"><div style="flex:1;min-width:190px;max-width:250px">${wallet(wr,dp)}</div><div class="mascot" aria-hidden="true">${mood[0]}</div><div style="flex:2;min-width:200px"><b>Minha carteira</b><div class="big">${money(bal)}</div><small>${mood[1]}</small><div class="top" style="margin:10px 0 0"><input id="wm" inputmode="decimal" placeholder="Meta de saldo (R$)" value="${wm?(wm/100).toString().replace('.',','):''}"><button class="b p" onclick="S.wm=cents($('#wm').value);save();render()">Definir meta</button></div></div></div><div class="grid">${card('Saldo total',money(bal),'<small>só movimentações efetivas</small>',bal<0?'neg':'')}${card('Receitas',money(R),vr(R,pR),'pos')}${card('Despesas',money(D),vr(D,pD),'neg')}${card('Economia líquida',money(R-D),'<small>receitas − despesas</small>',R-D<0?'neg':'pos')}${card('Taxa de economia',tx===null?'—':tx.toFixed(1).replace('.',',')+'%',tx===null?'<small>sem receitas no período</small>':'<small>da renda recebida</small>')}${card('Renda comprometida',R>0?(D/R*100).toFixed(0)+'%':'—','<small>despesas ÷ receitas</small>')}${card('Cofrinhos',gt?(gs/gt*100).toFixed(0)+'%':'—',`<small>${money(gs)} de ${money(gt)}</small>`)}</div>
<div class="two"><div class="c"><b>Despesas por categoria</b> <small>(toque para ver lançamentos)</small><div class="cv"><canvas id="c3"></canvas></div></div><div class="c"><b>Análises automáticas</b><ul>${ins.map(i=>`<li>${i}</li>`).join('')}</ul><small>Calculadas com seus dados; não são recomendações financeiras.</small></div></div>`}
function charts(){CH.forEach(c=>c.destroy());CH=[];if(!$('#c3'))return;const cs=getComputedStyle(document.documentElement),g=cs.getPropertyValue('--g'),r=cs.getPropertyValue('--r'),bl=cs.getPropertyValue('--b'),ink=cs.getPropertyValue('--ink'),ln=cs.getPropertyValue('--ln');
Chart.defaults.color=ink;Chart.defaults.borderColor=ln;Chart.defaults.font.family="'Instrument Sans',sans-serif";const[a,b]=rng(),ms=months(a,b),R=ms.map(k=>sumM('r',k)/100),D=ms.map(k=>sumM('d',k)/100),E=R.map((v,i)=>v-D[i]);const L=ms.map(mlab),o={responsive:true,maintainAspectRatio:false};
$('#c1')&&CH.push(new Chart($('#c1'),{type:'line',data:{labels:L,datasets:[{label:'Receitas',data:R,borderColor:g,tension:.3},{label:'Despesas',data:D,borderColor:r,tension:.3},{label:'Economia',data:E,borderColor:bl,tension:.3}]},options:o}));
$('#c2')&&CH.push(new Chart($('#c2'),{type:'bar',data:{labels:L,datasets:[{label:'Receitas',data:R,backgroundColor:g},{label:'Despesas',data:D,backgroundColor:r}]},options:o}));
const cats=DC.map(c=>[c,sum('d',a,b,c)]).filter(x=>x[1]>0),pal=['#0f7a5c','#2a5bd7','#b7791f','#b4372f','#7a4fd1','#14899e','#8a6d3b','#c2487d','#4d7c0f','#64748b','#d97706','#0369a1','#9ca3af'];
CH.push(new Chart($('#c3'),{type:'doughnut',data:{labels:cats.map(x=>x[0]),datasets:[{data:cats.map(x=>x[1]/100),backgroundColor:pal,borderWidth:0}]},options:{...o,plugins:{legend:{position:'right'}},onClick:(e,el)=>{if(el.length){F.cat=cats[el[0].index][0];V='tx';render()}}}}))}
function txv(){const[a,b]=rng();let l=S.tx.filter(x=>x.date>=a&&x.date<=b&&(!F.cat||x.cat==F.cat)&&(!F.t||x.t==F.t)&&(!F.q||x.desc.toLowerCase().includes(F.q.toLowerCase()))).sort((x,y)=>y.date<x.date?-1:1);
const td=ld(new Date());
return head('Lançamentos',periodBar())+`<div class="c"><b>Novo lançamento</b><div class="form" style="margin-top:8px"><select id="ft" onchange="fcat()"><option value="d">Despesa</option><option value="r">Receita</option></select><input id="fdsc" placeholder="Descrição"><input id="fv" inputmode="decimal" placeholder="Valor (ex.: 1.250,90)"><select id="fc"></select><input id="fdt" type="date" value="${td}"><select id="fs"><option value="ok">Efetivada (paga/recebida)</option><option value="prev">Prevista</option></select><button class="b p" onclick="add()">Salvar</button></div></div>
<div class="top" style="margin-top:14px"><select onchange="F.t=this.value;render()"><option value="">Todos os tipos</option><option value="r" ${F.t=='r'?'selected':''}>Receitas</option><option value="d" ${F.t=='d'?'selected':''}>Despesas</option></select><select onchange="F.cat=this.value;render()"><option value="">Todas as categorias</option>${[...DC,...RC].filter((x,i,A)=>A.indexOf(x)==i).map(c=>`<option ${F.cat==c?'selected':''}>${c}</option>`).join('')}</select><input placeholder="Pesquisar" value="${esc(F.q)}" onchange="F.q=this.value;render()"></div>
<div class="c sc">${l.length?`<table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Status</th><th>Valor</th><th></th></tr>${l.map(x=>`<tr><td>${fd(x.date)}</td><td>${esc(x.desc)}</td><td>${esc(x.cat)}</td><td>${ok(x)?(x.t=='r'?'Recebida':'Paga'):'Prevista'}</td><td class="${x.t=='r'?'pos':'neg'}">${x.t=='r'?'+':'−'} ${money(x.v)}</td><td>${ok(x)?'':`<button class="b" onclick="efet('${x.id}')">Efetivar</button> `}<button class="b" onclick="del('${x.id}')">${pend==x.id?'Confirmar exclusão':'Excluir'}</button></td></tr>`).join('')}</table>`:'<div class="empty">Nenhum lançamento neste período ou filtro.</div>'}</div>`}
function fcat(){const t=$('#ft').value;$('#fc').innerHTML=(t=='r'?RC:DC).map(c=>`<option>${c}</option>`).join('')}
function add(){const d=$('#fdsc').value.trim(),v=cents($('#fv').value),dt=$('#fdt').value;if(!d)return toast('Informe a descrição.');if(v<=0)return toast('Informe um valor maior que zero.');if(!dt)return toast('Informe a data.');
if($('#ft').value=='r'&&$('#fs').value=='ok')AN={w:1};S.tx.push({id:'t'+Date.now(),t:$('#ft').value,desc:d,v,cat:$('#fc').value,date:dt,st:$('#fs').value});save();render();toast('Lançamento salvo.')}
function efet(i){S.tx.find(x=>x.id==i).st='ok';save();render();toast('Lançamento efetivado.')}
function del(i){if(pend==i){S.tx=S.tx.filter(x=>x.id!=i);pend=null;save();render();toast('Lançamento excluído.')}else{pend=i;render()}}
function bud(){const ym=ld(new Date()).slice(0,7),tot=Object.values(S.bud).reduce((s,x)=>s+x,0);let gast=0;
const rows=DC.map(c=>{const l=S.bud[c]||0,g=sumM2(c,ym);gast+=g;const p=l?g/l*100:0,col=p>=100?'var(--r)':p>=80?'var(--y)':'var(--g)';return`<div class="c"><div class="top" style="margin:0"><b style="margin-right:auto">${c}</b><input style="width:120px" inputmode="decimal" placeholder="Limite R$" value="${l?(l/100).toString().replace('.',','):''}" onchange="S.bud['${c}']=cents(this.value);save();render()"></div><div class="bar"><i style="width:${Math.min(p,100)}%;background:${col}"></i></div><small>${money(g)} gastos${l?` de ${money(l)} (${p.toFixed(0)}%) · restam ${money(Math.max(l-g,0))}${p>=100?' · limite ultrapassado':p>=80?' · acima de 80%':p>=50?' · acima de 50%':''}`:' · sem limite definido'}</small></div>`}).join('');
return head('Orçamento do mês')+`<div class="grid"><div class="c"><small>Total orçado</small><div class="big">${money(tot)}</div></div><div class="c"><small>Total gasto</small><div class="big">${money(gast)}</div></div></div><div class="grid">${rows}</div>`}
const sumM2=(c,ym)=>S.tx.filter(x=>ok(x)&&x.t=='d'&&x.cat==c&&x.date.startsWith(ym)).reduce((s,x)=>s+x.v,0);
function goals(){return head('Cofrinhos')+`<div class="c"><div class="form"><input id="gn" placeholder="Nome (ex.: Reserva de emergência)"><input id="gv" inputmode="decimal" placeholder="Valor desejado"><input id="gd" type="date"><button class="b p" onclick="addG()">Criar cofrinho</button></div></div><div class="grid" style="margin-top:14px">${S.goals.length?S.goals.map((g,i)=>{const p=Math.min(g.saved/g.target*100,100),n=new Date(),dl=g.date?Math.max(1,(new Date(g.date+'T00:00').getFullYear()-n.getFullYear())*12+new Date(g.date+'T00:00').getMonth()-n.getMonth()):0,need=dl?Math.max(g.target-g.saved,0)/dl:0;return`<div class="c"><b>${esc(g.name)}</b>${pig(i,p/100,AN&&AN.pig===i)}<div class="bar"><i style="width:${p}%;background:var(--g)"></i></div><small>${money(g.saved)} de ${money(g.target)} (${p.toFixed(0)}%) · faltam ${money(Math.max(g.target-g.saved,0))}</small>${dl?`<br><small>Prazo ${fd(g.date)}: guardar ${money(Math.round(need))}/mês (estimativa linear, sem rendimentos)</small>`:''}<div class="top" style="margin:8px 0 0"><input id="gs${i}" style="width:110px" inputmode="decimal" placeholder="Depositar"><button class="b" onclick="dep(${i})">Guardar</button><button class="b" onclick="dep(${i},-1)">Retirar</button><button class="b" onclick="delG(${i})">${pend=='g'+i?'Confirmar':'Excluir'}</button></div></div>`}).join(''):'<div class="c empty">Nenhuma meta ainda. Crie a primeira acima.</div>'}</div>`}
function addG(){const n=$('#gn').value.trim(),v=cents($('#gv').value);if(!n||v<=0)return toast('Informe nome e valor desejado.');S.goals.push({name:n,target:v,saved:0,date:$('#gd').value});save();render();toast('Meta criada.')}
function dep(i,s=1){const v=cents($('#gs'+i).value);if(v<=0)return toast('Informe um valor válido.');if(s<0&&v>S.goals[i].saved)return toast('Valor maior que o saldo do cofrinho.');S.goals[i].saved+=v*s;if(s>0)AN={pig:i};save();render();toast(s>0?'Valor guardado.':'Valor retirado.')}
function delG(i){if(pend=='g'+i){S.goals.splice(i,1);pend=null;save();render()}else{pend='g'+i;render()}}
function tasks(){const l=[...S.tasks].sort((a,b)=>a.done-b.done||(a.due||'9')<(b.due||'9')?-1:1);return head('Tarefas')+`<div class="c"><div class="form"><input id="tn" placeholder="Nova tarefa"><input id="td" type="date"><button class="b p" onclick="addT()">Adicionar</button></div></div><div class="c sc" style="margin-top:14px">${l.length?`<table>${l.map(t=>`<tr><td><input type="checkbox" ${t.done?'checked':''} onchange="tg('${t.id}')" aria-label="Concluir"></td><td style="${t.done?'text-decoration:line-through;color:var(--mut)':''}">${esc(t.t)}</td><td>${t.due?fd(t.due):''}${!t.done&&t.due&&t.due<ld(new Date())?' <span class="neg">atrasada</span>':''}</td><td><button class="b" onclick="S.tasks=S.tasks.filter(x=>x.id!='${t.id}');save();render()">Excluir</button></td></tr>`).join('')}</table>`:'<div class="empty">Sem tarefas. Adicione contas a pagar ou revisões do orçamento.</div>'}</div>`}
function addT(){const n=$('#tn').value.trim();if(!n)return toast('Informe o título da tarefa.');S.tasks.push({id:'k'+Date.now(),t:n,due:$('#td').value,done:false});save();render()}
function tg(i){const t=S.tasks.find(x=>x.id==i);t.done=!t.done;save();render()}
let LV={},AN=null;
const coins=x=>[0,1,2,3].map(n=>`<circle class="cn" cx="${x+(n%2?7:-7)}" cy="14" r="7" fill="#f2b705" stroke="#b7791f" stroke-width="2" style="animation-delay:${n*.25}s"/>`).join('');
function wallet(r,drop){return `<svg viewBox="0 0 220 150" width="100%" role="img" aria-label="Carteira ${Math.round(r*100)}% da meta"><defs><pattern id="bn" width="30" height="16" patternUnits="userSpaceOnUse"><rect width="30" height="16" fill="#2f9e6b"/><rect y="14" width="30" height="2" fill="#7ad3a8"/><circle cx="15" cy="7" r="4" fill="#7ad3a8"/></pattern><clipPath id="kw"><rect x="32" y="50" width="130" height="76" rx="8"/></clipPath></defs>${drop?coins(97):''}<rect x="16" y="38" width="188" height="100" rx="16" fill="#7a4a2b"/><rect x="32" y="50" width="130" height="76" rx="8" fill="#2b1a10"/><g clip-path="url(#kw)"><rect id="wl" class="lv" data-to="${r}" x="32" y="50" width="130" height="76" fill="url(#bn)" style="transform:scaleY(${LV.wl??0})"/></g><rect x="150" y="76" width="54" height="34" rx="10" fill="#a9693d"/><circle cx="168" cy="93" r="5" fill="#f2d28b"/></svg>`}
function pig(i,p,drop){const id='pg'+i;return `<svg viewBox="0 0 220 150" width="100%" style="max-width:260px;display:block;margin:6px auto" role="img" aria-label="Cofrinho ${Math.round(p*100)}% cheio"><defs><pattern id="cp" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#e0a800"/><circle cx="8" cy="8" r="5.5" fill="#f7cf3d" stroke="#b7791f"/></pattern><clipPath id="k${id}"><ellipse cx="105" cy="85" rx="68" ry="46"/></clipPath></defs>${drop?coins(105):''}<path d="M40 80q-18-4-14-20" stroke="#d9889a" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="62" y="116" width="18" height="26" rx="7" fill="#e79bad"/><rect x="128" y="116" width="18" height="26" rx="7" fill="#e79bad"/><ellipse cx="105" cy="85" rx="68" ry="46" fill="#f8c6d0"/><g clip-path="url(#k${id})"><rect id="${id}" class="lv" data-to="${p}" x="37" y="39" width="136" height="92" fill="url(#cp)" style="transform:scaleY(${LV[id]??0})"/></g><ellipse cx="105" cy="85" rx="68" ry="46" fill="none" stroke="#d9889a" stroke-width="3"/><path d="M70 50l6-20 18 14z" fill="#e79bad"/><ellipse cx="176" cy="88" rx="14" ry="11" fill="#f1a7b6" stroke="#d9889a" stroke-width="2"/><circle cx="172" cy="88" r="2" fill="#8a3b4d"/><circle cx="181" cy="88" r="2" fill="#8a3b4d"/><circle cx="150" cy="70" r="4" fill="#14201c"/><rect x="85" y="38" width="40" height="6" rx="3" fill="#8a3b4d"/></svg>`}
function rep(){if(!S.tx.length)return head('Relatórios')+'<div class="c empty">Registre lançamentos para ver os gráficos.</div>';return head('Relatórios',periodBar())+'<div class="two"><div class="c"><b>Evolução mensal</b><div class="cv"><canvas id="c1"></canvas></div></div><div class="c"><b>Receitas × despesas</b><div class="cv"><canvas id="c2"></canvas></div></div><div class="c"><b>Despesas por categoria</b><div class="cv"><canvas id="c3"></canvas></div></div></div>'}
function more(){return head('Mais')+'<div class="grid"><button class="b" style="padding:16px" onclick="V=\'bud\';render()">Orçamento mensal</button><button class="b" style="padding:16px" onclick="V=\'tasks\';render()">Tarefas</button></div><div class="c"><small>Seus dados ficam salvos neste aparelho, no navegador. Não há login nem sincronização.</small></div>'}
const VS={dash:[0,dash],tx:[0,txv],goals:[0,goals],rep:[0,rep],more:[0,more],bud:[0,bud],tasks:[0,tasks]};const NAV=[['dash','Início','🏠',['dash']],['tx','Lançamentos','🧾',['tx']],['goals','Cofrinhos','🐷',['goals']],['rep','Relatórios','📊',['rep']],['more','Mais','☰',['more','bud','tasks']]];
function render(){$('#nav').innerHTML='<h1>Meu Dinheiro</h1>'+NAV.map(([k,l,i,g])=>`<button class="${g.includes(V)?'on':''}" onclick="V='${k}';pend=null;if('${k}'!='tx')F={cat:'',q:'',t:''};render()"><span>${i}</span>${l}</button>`).join('');
$('#m').innerHTML=VS[V][1]();const p=$('#pp');if(p)p.value=P;if($('#fc'))fcat();charts();if(V=='dash'||V=='goals')AN=null;requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.lv').forEach(e=>{e.style.transform='scaleY('+e.dataset.to+')';LV[e.id]=+e.dataset.to})))}
render();
</script></body></html>
